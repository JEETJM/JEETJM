<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1180" height="610"
    viewBox="0 0 1180 610">

    <defs>

        <!-- Background -->
        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#030712" />
            <stop offset="100%" stop-color="#0F172A" />
        </linearGradient>

        <!-- Animated Accent -->
        <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">

            <stop offset="0%" stop-color="#7C3AED">
                <animate attributeName="stop-color" values="#7C3AED;#22D3EE;#10B981;#7C3AED" dur="8s"
                    repeatCount="indefinite" />
            </stop>

            <stop offset="100%" stop-color="#22D3EE">
                <animate attributeName="stop-color" values="#22D3EE;#10B981;#7C3AED;#22D3EE" dur="8s"
                    repeatCount="indefinite" />
            </stop>

        </linearGradient>

        <!-- Blue Glow -->
        <radialGradient id="blueGlow">
            <stop offset="0%" stop-color="#22D3EE" stop-opacity=".35" />
            <stop offset="100%" stop-color="#22D3EE" stop-opacity="0" />
        </radialGradient>

        <!-- Purple Glow -->
        <radialGradient id="purpleGlow">
            <stop offset="0%" stop-color="#7C3AED" stop-opacity=".30" />
            <stop offset="100%" stop-color="#7C3AED" stop-opacity="0" />
        </radialGradient>

        <!-- Blur -->
        <filter id="blur">
            <feGaussianBlur stdDeviation="60" />
        </filter>

        <!-- Glow -->
        <filter id="glow">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>

    </defs>

    <!-- Background -->
    <rect width="1180" height="610" rx="28" fill="url(#bg)" />

    <!-- Left Glow -->
    <circle cx="170" cy="140" r="180" fill="url(#blueGlow)" filter="url(#blur)">
        <animateTransform attributeName="transform" type="translate" values="0 0;30 20;0 0" dur="9s"
            repeatCount="indefinite" />
    </circle>

    <!-- Right Glow -->
    <circle cx="980" cy="470" r="220" fill="url(#purpleGlow)" filter="url(#blur)">
        <animateTransform attributeName="transform" type="translate" values="0 0;-35 -20;0 0" dur="11s"
            repeatCount="indefinite" />
    </circle>

    <!-- Left Glass Panel -->
    <rect x="20" y="20" width="390" height="570" rx="24" fill="#111827" fill-opacity=".82" stroke="url(#accent)"
        stroke-width="2" />



    <!-- ASCII Avatar -->
    <image x="45" y="55" width="340" height="480" href="avatar.svg" />

    <!-- Right Glass Panel -->
    <rect x="430" y="20" width="730" height="570" rx="24" fill="#111827" fill-opacity=".82" stroke="url(#accent)"
        stroke-width="2" />



    <!-- Glass Reflection -->

    <path d="M445 25 L720 25 L610 590 L445 590 Z" fill="white" opacity="0.03">
        <animate attributeName="opacity" values="0.02;0.06;0.02" dur="6s" repeatCount="indefinite" />
    </path>
    <!-- </svg> -->
    <!-- PART 2 STARTS BELOW -->

    <!-- ========================= -->
    <!-- Terminal Window -->
    <!-- ========================= -->

    <!-- Window Controls -->
    <circle cx="465" cy="50" r="6" fill="#FF5F56" />
    <circle cx="485" cy="50" r="6" fill="#FFBD2E" />
    <circle cx="505" cy="50" r="6" fill="#27C93F" />

    <text x="530" y="55" fill="#94A3B8" font-size="16" font-family="JetBrains Mono">
        jeet@portfolio:~
    </text>

    <!-- Reflection -->
    <path d="M440 30 L760 30 L620 590 L440 590 Z" fill="white" opacity=".02" />

    <!-- Heading -->

    <text x="470" y="120" fill="#F8FAFC" font-size="34" font-family="JetBrains Mono" font-weight="700">

        Hi 👋

    </text>

    <text x="470" y="170" fill="url(#accent)" font-size="42" font-family="JetBrains Mono" font-weight="700"
        filter="url(#glow)">

        I'm Jeet Mondal

    </text>

    <!-- Subtitle -->

    <text x="470" y="225" fill="#22D3EE" font-size="24" font-family="JetBrains Mono">

        &gt; Full Stack Developer

    </text>

    <text x="470" y="260" fill="#10B981" font-size="24" font-family="JetBrains Mono">

        &gt; AI Enthusiast

    </text>

    <text x="470" y="295" fill="#A78BFA" font-size="24" font-family="JetBrains Mono">

        &gt; Open Source Contributor

    </text>

    <!-- Info -->

    <text x="470" y="360" fill="#94A3B8" font-size="18" font-family="JetBrains Mono">

        📍 West Bengal, India

    </text>

    <text x="470" y="395" fill="#94A3B8" font-size="18" font-family="JetBrains Mono">

        🎓 B.Tech IT

    </text>

    <text x="470" y="430" fill="#94A3B8" font-size="18" font-family="JetBrains Mono">

        🚀 MERN • AI • Open Source

    </text>

    <!-- Cursor -->

    <!-- Cursor -->

    <rect x="775" y="192" width="8" height="24" fill="#22D3EE">

        <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite" />

    </rect>

    <!-- ========================= -->
    <!-- Premium Skill Pills -->
    <!-- ========================= -->

    <g id="skills" font-family="JetBrains Mono" font-size="14">

        <!-- React -->
        <rect x="470" y="455" width="78" height="30" rx="15" fill="#1E293B" stroke="#22D3EE" stroke-width="1" />

        <text x="489" y="474" fill="#22D3EE">
            React
        </text>

        <!-- Node -->
        <rect x="560" y="455" width="80" height="30" rx="15" fill="#1E293B" stroke="#10B981" stroke-width="1" />

        <text x="581" y="474" fill="#10B981">
            Node
        </text>

        <!-- Java -->
        <rect x="655" y="455" width="72" height="30" rx="15" fill="#1E293B" stroke="#F59E0B" stroke-width="1" />

        <text x="676" y="474" fill="#F59E0B">
            Java
        </text>

        <!-- Python -->
        <rect x="742" y="455" width="92" height="30" rx="15" fill="#1E293B" stroke="#3B82F6" stroke-width="1" />

        <text x="760" y="474" fill="#3B82F6">
            Python
        </text>

        <!-- MongoDB -->
        <rect x="850" y="455" width="110" height="30" rx="15" fill="#1E293B" stroke="#22C55E" stroke-width="1" />

        <text x="868" y="474" fill="#22C55E">
            MongoDB
        </text>

    </g>

    <!-- ========================= -->
    <!-- Floating Particles -->
    <!-- ========================= -->

    <circle cx="120" cy="120" r="2" fill="#22D3EE">
        <animate attributeName="cy" values="120;90;120" dur="5s" repeatCount="indefinite" />
    </circle>

    <circle cx="1050" cy="150" r="2" fill="#7C3AED">
        <animate attributeName="cy" values="150;120;150" dur="7s" repeatCount="indefinite" />
    </circle>

    <circle cx="930" cy="520" r="2" fill="#10B981">
        <animate attributeName="cx" values="930;960;930" dur="6s" repeatCount="indefinite" />
    </circle>

    <!-- ========================= -->
    <!-- Bottom Social -->
    <!-- ========================= -->

    <text x="470" y="555" fill="#94A3B8" font-size="16" font-family="JetBrains Mono">

        GitHub • LinkedIn • Portfolio • Email

    </text>

    <!-- ========================= -->
    <!-- Animated Border -->
    <!-- ========================= -->

    <rect x="20" y="20" width="1140" height="570" rx="24" fill="none" stroke="url(#accent)" stroke-width="1">

        <animate attributeName="opacity" values=".3;1;.3" dur="4s" repeatCount="indefinite" />

    </rect>

    <!-- ========================= -->
    <!-- Scanline -->
    <!-- ========================= -->

    <rect x="20" y="-50" width="1140" height="60" fill="white" opacity="0">

        <animate attributeName="y" values="-50;620" dur="7s" repeatCount="indefinite" />

    </rect>

    <!-- ========================= -->
    <!-- Footer -->
    <!-- ========================= -->

    <text x="590" y="575" text-anchor="middle" font-size="14" font-family="JetBrains Mono" fill="#64748B">

        Built with ❤️ by Jeet Mondal

    </text>

    <!-- Floating Particles -->

    <g opacity="0.8">

        <circle cx="80" cy="120" r="2" fill="#22D3EE">
            <animate attributeName="cy" values="120;90;120" dur="5s" repeatCount="indefinite" />
        </circle>

        <circle cx="1020" cy="90" r="2" fill="#7C3AED">
            <animate attributeName="cy" values="90;140;90" dur="6s" repeatCount="indefinite" />
        </circle>

        <circle cx="930" cy="520" r="2" fill="#10B981">
            <animate attributeName="cx" values="930;970;930" dur="7s" repeatCount="indefinite" />
        </circle>

        <circle cx="220" cy="520" r="2" fill="#22D3EE">
            <animate attributeName="cx" values="220;260;220" dur="6s" repeatCount="indefinite" />
        </circle>


        <circle cx="205" cy="300" r="160" fill="url(#blueGlow)" filter="url(#blur)" opacity=".35" />

    </g>

</svg>